name: Assemble visual baseline

on:
  push:
    paths:
      - '.staging/ASSEMBLE'

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ !contains(github.event.head_commit.message, '[assembled]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .staging/archive.part* > /tmp/visual-baseline.b64
          base64 -d /tmp/visual-baseline.b64 > /tmp/visual-baseline.tar.gz
          tar -xzf /tmp/visual-baseline.tar.gz -C .
          rm -rf .staging
          rm -f .github/workflows/assemble-baseline.yml
      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          node --check game.js
          test -s index.html
          test -s styles.css
          test -s render.yaml
      - name: Commit assembled baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add polished playable visual baseline [assembled]'
          git push
